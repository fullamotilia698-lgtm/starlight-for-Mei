<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅宸瑜&欧阳宝尔 | 星河共舞，爱意永恒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Georgia', 'SimSun', serif;
            background: #050510;
        }
        .romance-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #050510;
            overflow: hidden;
            z-index: 0;
        }
        .light-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: blobMove 20s ease-in-out infinite alternate;
            will-change: transform;
        }
        .blob-1 { width: 50vw; height: 50vw; max-width: 600px; max-height: 600px; background: linear-gradient(135deg, #3a1c71, #2d1b4e); top: -15%; left: -10%; }
        .blob-2 { width: 45vw; height: 45vw; max-width: 550px; max-height: 550px; background: linear-gradient(135deg, #d76d77, #a85568); bottom: -15%; right: -10%; animation-delay: -7s; }
        .blob-3 { width: 40vw; height: 40vw; max-width: 500px; max-height: 500px; background: linear-gradient(135deg, #5433ff, #3d22b8); top: 35%; left: 25%; animation-duration: 25s; animation-delay: -3s; }
        .blob-4 { width: 35vw; height: 35vw; max-width: 400px; max-height: 400px; background: linear-gradient(135deg, #ff6b9d, #c44569); top: 60%; right: 20%; animation-duration: 22s; animation-delay: -10s; opacity: 0.25; }
        @keyframes blobMove {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(30px, 20px) scale(1.05) rotate(2deg); }
            66% { transform: translate(-20px, 30px) scale(1.1) rotate(-1deg); }
            100% { transform: translate(50px, -10px) scale(1.15) rotate(1deg); }
        }
        #starCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .blur-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; backdrop-filter: blur(0px); transition: backdrop-filter 0.8s ease-out; }
        .blur-layer.active { backdrop-filter: blur(3px); }
        .content-wrapper { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
        .stars-container { position: relative; width: 300px; height: 120px; margin-bottom: 40px; }
        .star { position: absolute; width: 20px; height: 20px; background: radial-gradient(circle, #fff 0%, rgba(255,230,150,0.8) 50%, transparent 70%); border-radius: 50%; box-shadow: 0 0 20px rgba(255,230,150,0.6), 0 0 40px rgba(255,183,197,0.4); animation: twinkle 2s ease-in-out infinite; }
        .star-left { left: 0; top: 50%; transform: translateY(-50%); animation: moveRight 8s ease-in-out forwards, twinkle 2s ease-in-out infinite; }
        .star-right { right: 0; top: 50%; transform: translateY(-50%); animation: moveLeft 8s ease-in-out forwards, twinkle 2s ease-in-out infinite; }
        @keyframes moveRight { 0% { left: 0; } 70%, 100% { left: calc(50% - 10px); } }
        @keyframes moveLeft { 0% { right: 0; } 70%, 100% { right: calc(50% - 10px); } }
        @keyframes twinkle { 0%, 100% { opacity: 1; transform: translateY(-50%) scale(1); } 50% { opacity: 0.7; transform: translateY(-50%) scale(0.9); } }
        .heart-container { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; animation: heartAppear 2s ease-out 6s forwards; }
        .heart { font-size: 60px; color: #ffb7c5; text-shadow: 0 0 20px rgba(255,183,197,0.8), 0 0 40px rgba(224,176,255,0.6); animation: heartPulse 1s ease-in-out infinite; }
        @keyframes heartAppear { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
        @keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .particle { position: absolute; width: 8px; height: 8px; border-radius: 50%; opacity: 0; animation: particleBurst 2s ease-out 6s forwards; }
        .particle:nth-child(7) { background: #ffb7c5; }
        .particle:nth-child(8) { background: #e0b0ff; }
        .particle:nth-child(9) { background: #fff; }
        .particle:nth-child(10) { background: rgba(255,230,150,0.9); }
        .particle:nth-child(11) { background: #ffb7c5; }
        .particle:nth-child(12) { background: #e0b0ff; }
        .particle:nth-child(13) { background: #fff; }
        .particle:nth-child(14) { background: rgba(255,230,150,0.9); }
        @keyframes particleBurst { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: var(--end-pos) scale(0); } }
        .text-content { text-align: center; max-width: 800px; }
        .main-title { font-size: clamp(24px, 5vw, 42px); background: linear-gradient(135deg, rgba(255,230,150,0.95), #fff8e7 30%, #ffe4e9 50%, #fff8e7 70%, rgba(255,230,150,0.95)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; animation: fadeInUp 1.5s ease-out; line-height: 1.6; }
        .subtitle { font-size: clamp(16px, 3vw, 22px); color: #f8f0ff; margin-bottom: 30px; animation: fadeInUp 1.5s ease-out 0.3s both; line-height: 1.8; }
        .body-text { font-size: clamp(14px, 2.5vw, 18px); color: #d8c8e8; line-height: 2; margin-bottom: 40px; animation: fadeInUp 1.5s ease-out 0.6s both; }
        .blessing { font-size: clamp(16px, 3vw, 20px); color: #ffc8d0; font-style: italic; padding: 20px 40px; border: 1px solid rgba(255,183,197,0.4); border-radius: 30px; background: linear-gradient(135deg, rgba(255,183,197,0.15), rgba(224,176,255,0.1)); animation: fadeInUp 1.5s ease-out 0.9s both; backdrop-filter: blur(10px); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .magic-button { position: relative; z-index: 20; margin-top: 50px; padding: 18px 45px; font-size: clamp(16px, 3vw, 20px); font-family: 'Georgia','SimSun',serif; color: #fff; background: linear-gradient(135deg, rgba(255,183,197,0.2), rgba(255,230,150,0.15) 50%, rgba(224,176,255,0.2)); border: 1px solid rgba(255,230,150,0.4); border-radius: 50px; cursor: pointer; overflow: hidden; transition: all 0.4s ease; backdrop-filter: blur(15px); animation: fadeInUp 1.5s ease-out 1.2s both; }
        .magic-button::before { content: ''; position: absolute; top: 0; left: -100%; width: 60%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.1) 60%, transparent); transform: skewX(-20deg); animation: shimmer 3s ease-in-out infinite; }
        @keyframes shimmer { 0%, 100% { left: -100%; } 50% { left: 150%; } }
        .magic-button:hover { background: linear-gradient(135deg, rgba(255,183,197,0.35), rgba(255,230,150,0.3) 50%, rgba(224,176,255,0.35)); border-color: rgba(255,230,150,0.7); transform: scale(1.05) translateY(-2px); box-shadow: 0 10px 40px rgba(255,183,197,0.25), 0 0 30px rgba(255,230,150,0.15); }
        .magic-button.hidden { opacity: 0; pointer-events: none; transform: scale(0.8); }
        .photo-container { position: fixed; z-index: 100; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.3); opacity: 0; pointer-events: none; }
        .photo-container.visible { opacity: 1; pointer-events: auto; animation: photoPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes photoPopIn { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3); } 50% { opacity: 1; } 70% { transform: translate(-50%,-50%) scale(1.06); } 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
        .photo-frame { position: relative; padding: 12px; background: linear-gradient(135deg, rgba(255,183,197,0.2), rgba(224,176,255,0.15)); border-radius: 16px; backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(255,183,197,0.35), 0 0 100px rgba(224,176,255,0.2); }
        .photo-frame img { display: block; max-width: min(80vw, 380px); max-height: 55vh; border-radius: 10px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3)); }
        .photo-flash { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.7); border-radius: 16px; pointer-events: none; animation: flashFade 0.6s ease-out forwards; }
        @keyframes flashFade { 0% { opacity: 1; } 100% { opacity: 0; } }
        .photo-frame::before { content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; background: linear-gradient(45deg, rgba(255,230,150,0.6), #ffb7c5, #e0b0ff, rgba(255,230,150,0.6)); background-size: 300% 300%; border-radius: 18px; z-index: -1; animation: borderFlow 4s ease infinite; opacity: 0.5; }
        @keyframes borderFlow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .photo-star { position: absolute; font-size: 18px; color: rgba(255,230,150,0.9); text-shadow: 0 0 8px rgba(255,230,150,0.8); animation: photoStarTwinkle 2s ease-in-out infinite; }
        @keyframes photoStarTwinkle { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }
        @media (max-width: 600px) { .stars-container { width: 200px; height: 100px; } .star { width: 15px; height: 15px; } .heart { font-size: 40px; } .blessing { padding: 15px 25px; } .magic-button { padding: 15px 35px; } .photo-frame img { max-width: 85vw; } .light-blob { filter: blur(60px); } }
    </style>
</head>
<body>
    <div class="romance-bg">
        <div class="light-blob blob-1"></div>
        <div class="light-blob blob-2"></div>
        <div class="light-blob blob-3"></div>
        <div class="light-blob blob-4"></div>
    </div>
    <canvas id="starCanvas"></canvas>
    <div class="blur-layer" id="blurLayer"></div>
    <div class="content-wrapper">
        <div class="stars-container">
            <div class="star star-left"></div>
            <div class="star star-right"></div>
            <div class="heart-container"><div class="heart">❤</div></div>
            <div class="particle" style="--end-pos: translate(-60px,-50px); animation-delay: 6.1s;"></div>
            <div class="particle" style="--end-pos: translate(60px,-50px); animation-delay: 6.1s;"></div>
            <div class="particle" style="--end-pos: translate(-50px,-60px); animation-delay: 6.2s;"></div>
            <div class="particle" style="--end-pos: translate(50px,-60px); animation-delay: 6.2s;"></div>
            <div class="particle" style="--end-pos: translate(-40px,50px); animation-delay: 6.3s;"></div>
            <div class="particle" style="--end-pos: translate(40px,50px); animation-delay: 6.3s;"></div>
            <div class="particle" style="--end-pos: translate(0,-70px); animation-delay: 6.15s;"></div>
            <div class="particle" style="--end-pos: translate(0,70px); animation-delay: 6.25s;"></div>
        </div>
        <div class="text-content">
            <h1 class="main-title">梅宸瑜&欧阳宝尔<br>星河共舞，爱意永恒</h1>
            <p class="subtitle">在茫茫人海中，你们找到了彼此最闪亮的那颗星</p>
            <p class="body-text">愿你们的爱情如星辰般璀璨，如银河般绵长。<br>每一刻相伴都是宇宙中最美的奇迹。</p>
            <p class="blessing">携手走过四季，共度岁月长河</p>
        </div>
        <button class="magic-button" id="magicBtn">✨ 点亮一份回忆 ✨</button>
    </div>
    <div class="photo-container" id="photoContainer">
        <div class="photo-frame">
            <div class="photo-flash" id="photoFlash"></div>
            <span class="photo-star" style="top:-20px;left:15px;">✦</span>
            <span class="photo-star" style="top:-20px;right:15px;animation-delay:0.5s;">✦</span>
            <span class="photo-star" style="bottom:-20px;left:50%;transform:translateX(-50%);animation-delay:1s;">✦</span>
            <!-- 注意：请将下面的图片链接替换为你自己的图片地址 -->
            <img id="couplePhoto" src="d4c3495892d4b2db5ff6b717b5865500.JPG" alt="我们的回忆">
        </div>
    </div>
    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let canvasWidth, canvasHeight;
        function resizeCanvas() { canvasWidth = canvas.width = window.innerWidth; canvasHeight = canvas.height = window.innerHeight; initStars(); }
        const romanticColors = [{r:255,g:255,b:255},{r:255,g:230,b:150},{r:255,g:183,b:197},{r:224,g:176,b:255}];
        const stars = [];
        const starCount = 150;
        function initStars() { stars.length = 0; for (let i = 0; i < starCount; i++) { const c = romanticColors[Math.floor(Math.random() * romanticColors.length)]; stars.push({ x: Math.random() * canvasWidth, y: Math.random() * canvasHeight, radius: Math.random() * 1.2 + 0.3, baseOpacity: Math.random() * 0.4 + 0.3, twinklePhase: Math.random() * Math.PI * 2, twinkleSpeed: Math.random() * 0.015 + 0.008, color: c }); } }
        const meteors = [];
        function createMeteor() { if (meteors.length >= 2 || Math.random() > 0.006) return; const c = romanticColors[Math.floor(Math.random() * romanticColors.length)]; meteors.push({ x: Math.random() * canvasWidth * 0.8, y: -10, speed: Math.random() * 4 + 3, angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2, color: c, length: Math.random() * 70 + 50 }); }
        function drawMeteor(m) { const tailX = m.x - Math.cos(m.angle) * m.length; const tailY = m.y - Math.sin(m.angle) * m.length; const gradient = ctx.createLinearGradient(m.x, m.y, tailX, tailY); gradient.addColorStop(0, `rgba(${m.color.r},${m.color.g},${m.color.b},0.9)`); gradient.addColorStop(0.4, `rgba(${m.color.r},${m.color.g},${m.color.b},0.4)`); gradient.addColorStop(1, 'rgba(255,255,255,0)'); ctx.shadowBlur = 15; ctx.shadowColor = `rgba(${m.color.r},${m.color.g},${m.color.b},0.5)`; ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tailX, tailY); ctx.strokeStyle = gradient; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.stroke(); const headGlow = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 8); headGlow.addColorStop(0, 'rgba(255,255,255,0.9)'); headGlow.addColorStop(0.4, `rgba(${m.color.r},${m.color.g},${m.color.b},0.5)`); headGlow.addColorStop(1, 'rgba(255,255,255,0)'); ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, Math.PI * 2); ctx.fillStyle = headGlow; ctx.fill(); ctx.shadowBlur = 0; }
        const PARTICLE_POOL_SIZE = 80;
        const particlePool = [];
        let activeParticles = 0;
        function initParticlePool() { for (let i = 0; i < PARTICLE_POOL_SIZE; i++) { particlePool.push({ active: false, x: 0, y: 0, vx: 0, vy: 0, size: 0, color: null, shape: '', opacity: 0, rotation: 0, rotationSpeed: 0, gravity: 0, friction: 0 }); } }
        function getParticle() { for (let i = 0; i < PARTICLE_POOL_SIZE; i++) { if (!particlePool[i].active) { particlePool[i].active = true; activeParticles = Math.max(activeParticles, i + 1); return particlePool[i]; } } return null; }
        function createBurst(x, y) { const colors = romanticColors; const shapes = ['●','❤','✦','·','❤']; for (let i = 0; i < 40; i++) { const p = getParticle(); if (!p) break; const angle = (Math.PI * 2 / 40) * i + Math.random() * 0.3; const speed = 2 + Math.random() * 5; p.x = x; p.y = y; p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed; p.size = 8 + Math.random() * 12; p.color = colors[Math.floor(Math.random() * colors.length)]; p.shape = shapes[Math.floor(Math.random() * shapes.length)]; p.opacity = 1; p.rotation = Math.random() * Math.PI * 2; p.rotationSpeed = (Math.random() - 0.5) * 0.1; p.gravity = 0.06 + Math.random() * 0.03; p.friction = 0.97 + Math.random() * 0.02; } for (let ring = 0; ring < 2; ring++) { setTimeout(() => { for (let i = 0; i < 15; i++) { const p = getParticle(); if (!p) break; const angle = (Math.PI * 2 / 15) * i; const speed = 4 + ring * 2; p.x = x; p.y = y; p.vx = Math.cos(angle) * speed; p.vy = Math.sin(angle) * speed; p.size = 5; p.color = { r: 255, g: 230, b: 150 }; p.shape = '✦'; p.opacity = 0.7; p.rotation = 0; p.rotationSpeed = 0; p.gravity = 0.02; p.friction = 0.96; } }, ring * 70); } }
        function updateAndDrawParticles() { for (let i = 0; i < activeParticles; i++) { const p = particlePool[i]; if (!p.active) continue; p.vx *= p.friction; p.vy *= p.friction; p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rotation += p.rotationSpeed; p.opacity -= 0.01; if (p.opacity <= 0) { p.active = false; } else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rotation); ctx.font = `${p.size}px Arial`; ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${p.opacity})`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.shape, 0, 0); ctx.restore(); } } while (activeParticles > 0 && !particlePool[activeParticles - 1].active) { activeParticles--; } }
        const specialMeteor = { active: false, x: 0, y: 0, targetX: 0, targetY: 0, speed: 12, trail: [], onComplete: null };
        const heartColors = [{r:255,g:183,b:197},{r:224,g:176,b:255},{r:255,g:255,b:255},{r:255,g:230,b:150}];
        function startSpecialMeteor(targetX, targetY, onComplete) { specialMeteor.active = true; specialMeteor.x = -30; specialMeteor.y = Math.random() * 80 + 40; specialMeteor.targetX = targetX; specialMeteor.targetY = targetY; specialMeteor.trail = []; specialMeteor.onComplete = onComplete; }
        function drawSpecialMeteor() { const sm = specialMeteor; const dx = sm.targetX - sm.x; const dy = sm.targetY - sm.y; const distance = Math.sqrt(dx * dx + dy * dy); if (distance < 15) { sm.active = false; if (sm.onComplete) sm.onComplete(); return; } const angle = Math.atan2(dy, dx); sm.x += Math.cos(angle) * sm.speed; sm.y += Math.sin(angle) * sm.speed; const color = heartColors[Math.floor(Math.random() * heartColors.length)]; sm.trail.push({ x: sm.x, y: sm.y, size: 10 + Math.random() * 5, color: color }); if (sm.trail.length > 22) sm.trail.shift(); ctx.shadowBlur = 20; ctx.shadowColor = 'rgba(255,183,197,0.5)'; sm.trail.forEach((point, idx) => { const progress = idx / sm.trail.length; const opacity = progress * 0.6; const size = point.size * progress; ctx.font = `${size}px Arial`; ctx.fillStyle = `rgba(${point.color.r},${point.color.g},${point.color.b},${opacity})`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('❤', point.x, point.y); }); const headGlow = ctx.createRadialGradient(sm.x, sm.y, 0, sm.x, sm.y, 18); headGlow.addColorStop(0, 'rgba(255,183,197,0.6)'); headGlow.addColorStop(0.5, 'rgba(255,183,197,0.2)'); headGlow.addColorStop(1, 'rgba(255,183,197,0)'); ctx.beginPath(); ctx.arc(sm.x, sm.y, 18, 0, Math.PI * 2); ctx.fillStyle = headGlow; ctx.fill(); ctx.font = '24px Arial'; ctx.fillStyle = '#ffb7c5'; ctx.fillText('💖', sm.x, sm.y); ctx.shadowBlur = 0; }
        let time = 0;
        function animate() { ctx.clearRect(0, 0, canvasWidth, canvasHeight); time += 0.016; stars.forEach(star => { const twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinklePhase); const opacity = Math.max(0.1, star.baseOpacity + twinkle * 0.25); ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2); ctx.fillStyle = `rgba(${star.color.r},${star.color.g},${star.color.b},${opacity})`; ctx.fill(); if (star.radius > 0.7) { ctx.beginPath(); ctx.arc(star.x, star.y, star.radius * 2.5, 0, Math.PI * 2); ctx.fillStyle = `rgba(${star.color.r},${star.color.g},${star.color.b},${opacity * 0.12})`; ctx.fill(); } }); createMeteor(); for (let i = meteors.length - 1; i >= 0; i--) { const m = meteors[i]; m.x += Math.cos(m.angle) * m.speed; m.y += Math.sin(m.angle) * m.speed; if (m.x > canvasWidth + 50 || m.y > canvasHeight + 50) { meteors.splice(i, 1); } else { drawMeteor(m); } } if (specialMeteor.active) drawSpecialMeteor(); updateAndDrawParticles(); requestAnimationFrame(animate); }
        const magicBtn = document.getElementById('magicBtn');
        const photoContainer = document.getElementById('photoContainer');
        const photoFlash = document.getElementById('photoFlash');
        const blurLayer = document.getElementById('blurLayer');
        let photoShown = false;
        magicBtn.addEventListener('click', () => { if (photoShown) return; magicBtn.classList.add('hidden'); startSpecialMeteor(canvasWidth / 2, canvasHeight / 2, () => { blurLayer.classList.add('active'); createBurst(canvasWidth / 2, canvasHeight / 2); setTimeout(() => { photoFlash.style.animation = 'none'; photoFlash.offsetHeight; photoFlash.style.animation = 'flashFade 0.6s ease-out forwards'; photoContainer.classList.add('visible'); photoShown = true; setTimeout(() => { blurLayer.classList.remove('active'); }, 800); }, 120); }); });
        resizeCanvas();
        initParticlePool();
        animate();
        window.addEventListener('resize', resizeCanvas);
    </script>
</body>
</html>
